{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<div class="app-shell">

    <nav class="app-nav">
        <div class="brand-mark">
            <span class="brand-mark-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5Z" stroke="#0b1526" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="M9 12.5l2 2 4-4.5" stroke="#0b1526" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span class="brand-mark-name">Veridoc</span>
        </div>
    </nav>

    <main class="app-main app-main-narrow">

        <div class="card app-form-card">

            <span class="eyebrow">Secure workspace</span>
            <h1 class="app-form-title">Vérification MFA</h1>

            <p class="app-form-notice">
                Votre mot de passe est correct.
                Entrez maintenant le code de Google Authenticator.
            </p>

            <form method="POST" class="auth-form">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">

                    <label
                        for="code"
                        class="form-label"
                    >
                        Code à 6 chiffres
                    </label>

                    <input
                        type="text"
                        id="code"
                        name="code"
                        class="form-input form-input-code"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        autocomplete="one-time-code"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Vérifier
                </button>

            </form>

        </div>

    </main>

</div>

{% endblock %}
